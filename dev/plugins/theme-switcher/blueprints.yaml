name: Theme Switcher (development)
version: 0.1.0
description: "Development only: ?theme=<name> shows the site in another theme, kept in a cookie; ?theme= goes back."
author:
  name: w4os
license: AGPL-3.0-or-later
dependencies:
  - { name: grav, version: '>=1.7.0' }
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      options: { 1: PLUGIN_ADMIN.ENABLED, 0: PLUGIN_ADMIN.DISABLED }
      validate: { type: bool }
