home:
  alias: '/home'
pages:
  theme: w4os
  markdown:
    extra: true
  process:
    twig: false
languages:
  # English and the languages of the OpenSim suite (the locales of opensim-helpers, and Dutch)
  supported: [en, fr, de, it, nl, pt-BR, cy]
  default_lang: en
  include_default_lang: false
  translations: true
  translations_fallback: true
  # The language of the browser for a first visit, then the one chosen in the menu (oli-langswitcher keeps it in the session)
  http_accept_language: true
cache:
  enabled: true
  check:
    method: file
twig:
  cache: true
assets:
  # The styles and scripts with the date of their file: a browser takes a changed one at once
  enable_asset_timestamp: true
errors:
  display: 0
  log: true
debugger:
  enabled: false
session:
  enabled: true
  # Signed in for a day without a visit; longer with "remember me" (the Login plugin, plugins/login.yaml)
  timeout: 86400
  # The sessions in a folder of the site (relative to the root of Grav: the zip; the package sends them to /var/lib/w4os-site/sessions
  # in its .env), where PHP alone cleans them, after a day: the system's own cleaning (Debian and Ubuntu's phpsessionclean, every
  # half hour) takes the ones of its own folder after 24 minutes
  options:
    save_path: user/data/sessions
    gc_maxlifetime: 86400
    gc_probability: 1
    gc_divisor: 1000
gpm:
  releases: stable
