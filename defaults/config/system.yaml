home:
  alias: '/home'
pages:
  theme: w4os
  markdown:
    extra: true
  process:
    twig: false
languages:
  # The languages of the OpenSim suite; the main five are still to choose
  supported: [en, fr, de, it, nl, pt-BR, cy]
  include_default_lang: false
  translations: true
  http_accept_language: true
cache:
  enabled: true
  check:
    method: file
twig:
  cache: true
errors:
  display: 0
  log: true
debugger:
  enabled: false
session:
  enabled: true
gpm:
  releases: stable
