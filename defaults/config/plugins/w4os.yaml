enabled: true
# Set by w4os-site setup: the engine API, at its own address (api_url: https://grid.example.org/api, or
# http://127.0.0.1:8780/api on the machine of the grid), and the address of the helpers of the grid, for the blocks (url). The
# key is kept in user/data/w4os/api.json.
api_url: ''
url: ''
# The avatars kept as accounts of the site (user/accounts: name, email, level, access; no password), so "remember me" finds them
# again; a session back by it takes the avatar as the engine has it then
save_accounts: true
