name: w4os site
slug: w4os
type: theme
version: 0.1.0
description: The light theme of the w4os site, a child of Quark2.
icon: globe
author:
  name: Magìiíc
license: AGPL-3.0-or-later
dependencies:
  - { name: quark2, version: '>=1.1.0' }
form:
  validation: loose
  fields:
    accent-color:
      type: colorpicker
      label: Accent color
    slogan:
      type: array
      label: Slogan
      help: By language (en, fr...). The title of the home page is the title of the site, then the slogan of its language (else the one of the default language).
      placeholder_key: en
      placeholder_value: 'A place to meet, build and explore'
    # Quark2's logo and favicon (its partials draw them), kept with the data of the site (the images of the theme's stream)
    custom_logo:
      type: file
      label: Custom Logo
      destination: 'theme://images/logo'
      multiple: false
      accept:
        - image/*
    custom_favicon:
      type: file
      label: Custom Favicon
      filesize: 0.1
      destination: 'theme://images/favicon'
      multiple: false
      accept:
        - image/png
        - image/svg+xml
        - .ico
