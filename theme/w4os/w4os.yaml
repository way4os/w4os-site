enabled: true
# The menus of the visitor (the w4os plugin's: the admin, the avatar) in the top bar, not as entries of the menu
w4os_menus: true
# The settings of Quark2
header-fixed: true
header-animated: true
header-transparent: false
header-dark: false
header-light: false
sticky-footer: true
layout-fluid: false
# The width of a page (bleed, full, sidebars, wide, standard) by its template, a page of the w4os plugin by its type (w4os-<type>): the
# home of the grid with its blocks in sidebars, the search the whole width, the map edge to edge, the guide and the news as wide as the
# menu bar
widths:
  default: standard
  home: sidebars
  blog: wide
  w4os-search: full
  w4os-map: bleed
  w4os-guide: wide
theme-mode: auto
accent-color: '#61c909'
# The logo of the site, Quark2's own setting (the settings page of the site changes it): the OpenSimulator logo until the site sets
# its own
custom_logo:
  user/themes/w4os/images/logo/opensimulator-logo.png:
    name: opensimulator-logo.png
    type: image/png
    path: user/themes/w4os/images/logo/opensimulator-logo.png
# The favicon of the site, Quark2's own setting (the settings page of the site changes it): the OpenSimulator logo on a square
# until the site sets its own
custom_favicon:
  user/themes/w4os/images/favicon/opensimulator-logo-square.png:
    name: opensimulator-logo-square.png
    type: image/png
    path: user/themes/w4os/images/favicon/opensimulator-logo-square.png
# The slogan of the site, by language: the title of the home page is "<site> | <slogan>" (the site title alone without one)
slogan:
  en: 'A place to meet, build and explore'
  fr: 'Un lieu pour se rencontrer, construire et explorer'
  de: 'Ein Ort zum Treffen, Bauen und Entdecken'
  it: 'Un luogo per incontrarsi, costruire ed esplorare'
  nl: 'Een plek om elkaar te ontmoeten, te bouwen en te ontdekken'
  pt-BR: 'Um lugar para se encontrar, construir e explorar'
  cy: 'Lle i gyfarfod, adeiladu ac archwilio'
blog-page: '/blog'
# Font Awesome Free, served by the site (the package bundles it: dependencies.txt), never from a CDN
fontawesome:
  enabled: true
  local: true
streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - user://themes/w4os
          - user://themes/quark2
        # Quark2's own templates as @quark2, for the ones this theme extends
        'quark2/':
          - user://themes/quark2
