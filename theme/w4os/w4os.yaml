enabled: true
# The settings of Quark2
header-fixed: true
header-animated: true
header-transparent: false
header-dark: false
header-light: false
sticky-footer: true
layout-fluid: false
theme-mode: auto
accent-color: '#61c909'
# The logo of the grid before its name in the top bar (its own, else the OpenSimulator logo), unless the theme has a custom logo
grid_logo: true
blog-page: '/blog'
fontawesome:
  enabled: true
  local: false
streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - user://themes/w4os
          - user://themes/quark2
        # Quark2's own templates as @quark2, for the ones this theme extends
        'quark2/':
          - user://themes/quark2
        # The logo and the favicon the site sets (Quark2's custom_logo and custom_favicon) are kept with the data of the site
        'images':
          - user://data/theme/images
          - user://themes/w4os/images
          - user://themes/quark2/images
