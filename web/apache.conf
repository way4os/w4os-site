# The w4os site ({{host}}), made by w4os-site web apache. Grav's .htaccess does the rest.
{{listen}}
<VirtualHost *:{{port}}>
    ServerName {{host}}
    DocumentRoot {{root}}

    <Directory {{root}}>
        Require all granted
        AllowOverride All
        Options -Indexes +FollowSymLinks -MultiViews
    </Directory>

    {{php}}

    ErrorLog ${APACHE_LOG_DIR}/w4os-site-error.log
    CustomLog ${APACHE_LOG_DIR}/w4os-site-access.log combined
</VirtualHost>
