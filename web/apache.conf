# The w4os site ({{host}}), made by w4os-site web apache. Grav's .htaccess does the rest.
{{listen}}
<VirtualHost *:{{port}}>
    ServerName {{host}}
    DocumentRoot /usr/share/w4os-site/grav{{helpers}}

    <Directory /usr/share/w4os-site/grav>
        Require all granted
        AllowOverride All
        Options -Indexes +FollowSymLinks -MultiViews
    </Directory>
    <Directory /var/cache/w4os-site>
        Require all granted
    </Directory>

    {{php}}

    ErrorLog ${APACHE_LOG_DIR}/w4os-site-error.log
    CustomLog ${APACHE_LOG_DIR}/w4os-site-access.log combined
</VirtualHost>
